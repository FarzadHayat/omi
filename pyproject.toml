[project]
name = "hark"
version = "0.1.0"
description = "Fast voice-to-voice assistant that controls your device"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "sherpa-onnx>=2.0.3",
    "piper-tts>=1.3",
    "kokoro-onnx>=0.4",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.scripts]
omi = "hark.cli:main"
hark = "hark.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: calls a real model or service (llama-server, claude); slower",
]
