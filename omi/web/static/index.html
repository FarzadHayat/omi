<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="color-scheme" content="dark light">
<title>Omi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main class="app" data-state="connecting">
  <header class="bar">
    <div class="brand">
      <svg class="omi-face" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
        <rect x="4" y="8" width="56" height="48" rx="14" class="omi-shell"/>
        <rect x="11" y="15" width="42" height="34" rx="9" class="omi-visor"/>
        <rect x="20" y="23" width="8" height="16" rx="4" class="omi-eye"/>
        <rect x="36" y="23" width="8" height="16" rx="4" class="omi-eye"/>
      </svg>
      <h1 id="name">Omi</h1>
    </div>
    <p class="state" role="status" aria-live="polite" aria-atomic="true"><span class="shape" aria-hidden="true"></span><span id="state-text">Connecting</span></p>
  </header>

  <section class="log" id="log" aria-label="Conversation" tabindex="0">
    <ol id="transcript" aria-live="polite" aria-relevant="additions"></ol>
  </section>

  <section class="confirm" id="confirm" role="alertdialog" aria-labelledby="confirm-q" aria-describedby="confirm-detail" hidden>
    <p id="confirm-q" class="question"></p>
    <p id="confirm-detail" class="detail" hidden></p>
    <div class="answers">
      <button type="button" id="yes" class="yes">Yes</button>
      <button type="button" id="no" class="no">No</button>
    </div>
  </section>

  <section class="controls" aria-label="Voice">
    <button type="button" id="talk" class="talk" aria-pressed="false">
      <span class="talk-label">Talk</span>
    </button>
    <button type="button" id="stop" class="stop">Stop</button>
  </section>

  <form id="compose" class="compose" autocomplete="off">
    <label for="text" class="sr-only">Message</label>
    <input id="text" name="text" type="text" maxlength="2000" enterkeyhint="send" autocapitalize="sentences">
    <button type="submit" id="send">Send</button>
  </form>
</main>
</body>
</html>
