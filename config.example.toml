# Omi configuration — copy to ~/.config/omi/config.toml
# Every option below shows its default value; omit anything you don't want to change.

name = "Omi"

[audio]
source = ""        # PipeWire mic source name; empty = default microphone
sink = ""          # PipeWire output sink; empty = default output ("null" = silent)
silence_ms = 300   # Hands-free silence window in milliseconds

[wake]
enabled = true
phrases = ["hey omi", "okay omi"]
threshold = 0.25         # Higher = stricter (fewer false triggers), lower = more sensitive
score = 1.0              # Keyword boost score
silence_ms = 650         # End-of-turn silence after speaking a wake-word command
initial_timeout_s = 3.5  # Cancel if nothing is said after waking Omi
chime = true             # Play a soft chime when Omi wakes up

[stt]
engine = "nemotron"  # "nemotron" (streaming) | "moonshine"
threads = 4
# Words speech recognition should boost (names, tools, jargon you say often)
hotwords = ["Omi", "Omarchy", "Hyprland"]

[tts]
engine = "kokoro"          # "kokoro" | "piper"
kokoro_voice = "af_heart"  # e.g. af_heart, af_bella, am_adam, bf_emma, bm_george
speed = 1.0

[brain]
talker = "claude"  # "claude" | "local"
worker = "claude"  # "claude" | "off"

[brain.claude]
model = "haiku"
worker_model = "sonnet"
chrome = true  # allow background worker to use Claude in Chrome MCP tools

[brain.local]
# Set base_url to use any OpenAI-compatible server; leave empty to auto-start llama-server.
base_url = ""
api_key_env = ""
model_name = "local"
port = 47910
gpu_layers = 99
ctx = 8192

[memory]
enabled = true
# Defaults to ~/.local/share/omi/memory
# dir = "~/.local/share/omi/memory"
# Optional read-only shared memory directory (e.g. a synced Obsidian folder)
shared_dir = ""

[web]
enabled = true
port = 47911
# Empty = auto-detect the Tailscale login that owns this machine
allowed_logins = []
origins = []
