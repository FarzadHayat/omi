# Omi configuration — copy to ~/.config/omi/config.toml
# Every option below shows its default value; omit anything you don't want to change.

name = "Omi"

[audio]
source = ""        # PipeWire mic source name; empty = default microphone
sink = ""          # PipeWire output sink; empty = default output ("null" = silent)
silence_ms = 300   # Hands-free silence window in milliseconds

[wake]
enabled = true
phrases = ["omi", "hey omi", "okay omi"]
threshold = 0.15         # Lower = more sensitive (0.10-0.25), higher = stricter
score = 1.0              # Keyword boost score
silence_ms = 750         # End-of-turn silence while speaking a command
initial_timeout_s = 4.0  # Cancel if nothing is said right after waking Omi
call_mode = "auto"       # "auto" (smart) | "continuous" | "single"
followup_timeout_s = 12.0  # Prolonged silence ends the conversation automatically
chime = true             # Soft rising chime on wake, descending chime on call end

[stt]
engine = "nemotron"  # "nemotron" (streaming) | "moonshine"
threads = 4
# Words speech recognition should boost (names, tools, jargon you say often)
hotwords = ["Omi", "Omarchy", "Hyprland"]

[tts]
engine = "kokoro"          # "kokoro" | "piper"
kokoro_voice = "af_heart"  # e.g. af_heart, af_bella, am_adam, bf_emma, bm_george
speed = 1.0

[brain]
# Talker: claude | opencode | codex | agy | gemini | local | openai | auto
# Worker: claude | opencode | codex | agy | gemini | off | auto
# Subscription CLIs use your existing CLI login (no API keys required).
talker = "claude"
worker = "claude"

[brain.claude]
model = "haiku"
worker_model = "sonnet"
chrome = true  # allow background worker to use Claude in Chrome MCP tools

[brain.opencode]
# Empty = use your OpenCode default model (e.g. "opencode/deepseek-v4.1-flash-free")
model = ""
worker_model = ""

[brain.codex]
# Uses your ChatGPT Plus/Pro login in `codex` (empty = Codex default model)
model = ""
worker_model = ""

[brain.agy]
# Uses your Antigravity / Google AI Pro/Ultra login in `agy`
model = ""
worker_model = ""
effort = "low"

[brain.gemini]
# Uses your Google account login in `gemini` CLI
model = ""
worker_model = ""

[brain.local]
# Works with llama-server (leave base_url empty), Ollama ("http://127.0.0.1:11434/v1"),
# LM Studio, OpenRouter, xAI/Grok ("https://api.x.ai/v1"), or any OpenAI-compatible API.
base_url = ""
api_key_env = ""
model_name = "local"
port = 47910
gpu_layers = 99
ctx = 8192

[memory]
enabled = true
# Defaults to ~/.local/share/omi/memory
# dir = "~/.local/share/omi/memory"
# Optional read-only shared memory directory (e.g. a synced Obsidian folder)
shared_dir = ""

[web]
enabled = true
port = 47911
# Empty = auto-detect the Tailscale login that owns this machine
allowed_logins = []
origins = []
